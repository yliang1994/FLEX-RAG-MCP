llm:
  provider: stub
  model: stub-llm
  api_key: ""

embedding:
  provider: stub
  model: stub-embedding

splitter:
  method: recursive
  chunk_size: 500
  chunk_overlap: 50

vector_store:
  backend: chroma
  persist_path: ./data/db/chroma

retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

rerank:
  backend: none
  model: ""
  top_m: 30

evaluation:
  backends: [custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

observability:
  enabled: true
  log_file: ./logs/traces.jsonl

ingestion:
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
